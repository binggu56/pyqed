<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      .bond {
        stroke: #163A5F;
        stroke-width: 12;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .node {
        fill: #4F9FE6;
        stroke: #163A5F;
        stroke-width: 10;
      }
    </style>
  </defs>

  <!-- Regular hexagon bonds -->
  <line class="bond" x1="256" y1="116" x2="370" y2="182"/>
  <line class="bond" x1="370" y1="182" x2="370" y2="330"/>
  <line class="bond" x1="370" y1="330" x2="256" y2="396"/>
  <line class="bond" x1="256" y1="396" x2="142" y2="330"/>
  <line class="bond" x1="142" y1="330" x2="142" y2="182"/>
  <line class="bond" x1="142" y1="182" x2="256" y2="116"/>

  <!-- Ring nodes -->
  <circle class="node" cx="256" cy="92" r="34"/>
  <circle class="node" cx="390" cy="170" r="34"/>
  <circle class="node" cx="390" cy="342" r="34"/>
  <circle class="node" cx="256" cy="420" r="34"/>
  <circle class="node" cx="122" cy="342" r="34"/>
  <circle class="node" cx="122" cy="170" r="34"/>
</svg>
