version: 2
updates:
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    groups:
      website-security:
        applies-to: security-updates
        patterns:
          - "*"
      website-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Shanghai
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
