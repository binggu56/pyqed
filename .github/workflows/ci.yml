name: CI

on:
  push:
    branches: [main, bg, stable]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  MPLBACKEND: Agg

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  website:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Lint and test the production export
        run: |
          npm run lint
          npm test

  core:
    name: Core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install PyQED and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run release and core smoke tests
        run: >-
          python -m pytest -q
          tests/test_release_smoke.py
          tests/test_superoperator_lindblad.py
          tests/test_integrate.py

  native-extensions:
    name: All extension groups
    runs-on: ubuntu-latest
    env:
      PYQED_BUILD_EXTENSIONS: "1"
      PYQED_EXTENSION_GROUPS: all

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Compile the opt-in extensions
        run: |
          python -m pip install --upgrade pip setuptools "Cython>=3.1,<3.3"
          PYQED_BUILD_EXTENSIONS=0 python -m pip install -e ".[test]"
          python setup.py build_ext --inplace
      - name: Verify native imports and public quickstart
        run: |
          python -c 'from pyqed.qchem import _basis_cy, _casscf_cpp, _integrals_cpp, _rys_cy; from pyqed.heom import _heom_cpp; from pyqed.mps.nonabelian import _su2_kernel; assert all(module is not None for module in (_basis_cy, _casscf_cpp, _integrals_cpp, _rys_cy, _heom_cpp, _su2_kernel))'
          python examples/quickstart.py

  cas-native:
    name: Native CAS / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      PYQED_BUILD_EXTENSIONS: "1"
      PYQED_EXTENSION_GROUPS: qchem

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Compile and test native CAS
        run: |
          python -m pip install --upgrade pip setuptools "Cython>=3.1,<3.3"
          PYQED_BUILD_EXTENSIONS=0 python -m pip install -e ".[test]"
          python setup.py build_ext --inplace
          python -c 'from pyqed.qchem import _casscf_cpp; assert _casscf_cpp is not None'
          python -m pytest -q tests/test_casci.py -k native_rhf_davidson

  distribution:
    name: Wheel and source distribution
    runs-on: ubuntu-latest
    env:
      PYQED_BUILD_EXTENSIONS: "1"
      PYQED_EXTENSION_GROUPS: qchem

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Build and inspect distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Install and test the wheel in isolation
        run: |
          python -m venv /tmp/pyqed-wheel
          /tmp/pyqed-wheel/bin/python -m pip install --upgrade pip
          /tmp/pyqed-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/pyqed-wheel/bin/python "$GITHUB_WORKSPACE/examples/quickstart.py"
          /tmp/pyqed-wheel/bin/python -c 'from importlib.metadata import version; from pathlib import Path; import pyqed; from pyqed.qchem import _casscf_cpp; from pyqed.qchem.basis import _basis_path; assert pyqed.__version__ == version("pyqed"); assert _casscf_cpp is not None; assert Path(_basis_path("sto-3g")).is_file()'
      - name: Install and test the source distribution in isolation
        run: |
          python -m venv /tmp/pyqed-sdist
          /tmp/pyqed-sdist/bin/python -m pip install --upgrade pip
          /tmp/pyqed-sdist/bin/python -m pip install dist/*.tar.gz
          cd /tmp
          /tmp/pyqed-sdist/bin/python "$GITHUB_WORKSPACE/examples/quickstart.py"

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          PYQED_BUILD_EXTENSIONS=0 python -m pip install -e ".[docs]"
      - name: Build documentation without warnings
        run: sphinx-build -W --keep-going -b html docs/source /tmp/pyqed-docs
