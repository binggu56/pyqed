name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  MPLBACKEND: Agg

jobs:
  core:
    name: Core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install PyQED and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run release and core smoke tests
        run: >-
          python -m pytest -q
          tests/test_release_smoke.py
          tests/test_superoperator_lindblad.py
          tests/test_integrate.py

  native-extensions:
    name: Optional native extensions
    runs-on: ubuntu-latest
    env:
      PYQED_BUILD_EXTENSIONS: "1"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Compile the opt-in extensions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Verify native imports and public quickstart
        run: |
          python -c 'from pyqed.qchem import _basis_cy, _integrals_cpp, _rys_cy; from pyqed.heom import _heom_cpp; from pyqed.mps.nonabelian import _su2_kernel; assert all(module is not None for module in (_basis_cy, _integrals_cpp, _rys_cy, _heom_cpp, _su2_kernel))'
          python examples/quickstart.py

  distribution:
    name: Wheel and source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Build and inspect distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Install and test the wheel in isolation
        run: |
          python -m venv /tmp/pyqed-wheel
          /tmp/pyqed-wheel/bin/python -m pip install --upgrade pip
          /tmp/pyqed-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/pyqed-wheel/bin/python "$GITHUB_WORKSPACE/examples/quickstart.py"
          /tmp/pyqed-wheel/bin/python -c 'from importlib.metadata import version; from pathlib import Path; import pyqed; from pyqed.qchem.basis import _basis_path; assert pyqed.__version__ == version("pyqed") == "0.2.0"; assert Path(_basis_path("sto-3g")).is_file()'
      - name: Install and test the source distribution in isolation
        run: |
          python -m venv /tmp/pyqed-sdist
          /tmp/pyqed-sdist/bin/python -m pip install --upgrade pip
          /tmp/pyqed-sdist/bin/python -m pip install dist/*.tar.gz
          cd /tmp
          /tmp/pyqed-sdist/bin/python "$GITHUB_WORKSPACE/examples/quickstart.py"

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
      - name: Build documentation without warnings
        run: sphinx-build -W --keep-going -b html docs/source /tmp/pyqed-docs
