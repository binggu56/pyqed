name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  wheels:
    name: Wheel / ${{ matrix.os }} / ${{ matrix.arch }}
    if: github.repository == 'binggu56/pyqed'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: windows-latest
            arch: AMD64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-14
            arch: arm64

    steps:
      - uses: actions/checkout@v7
      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
      - name: Store wheels
        uses: actions/upload-artifact@v7
        with:
          name: python-package-wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    if: github.repository == 'binggu56/pyqed'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Require the tag to match the package version
        run: >-
          python -c 'import os, runpy;
          package_version = runpy.run_path("pyqed/_version.py")["__version__"];
          tag_version = os.environ["GITHUB_REF_NAME"].removeprefix("v");
          assert tag_version == package_version,
          f"tag {tag_version!r} does not match package {package_version!r}"'
      - name: Build and inspect the source distribution
        run: |
          python -m pip install --upgrade pip build twine
          PYQED_BUILD_EXTENSIONS=0 python -m build --sdist
          python -m twine check dist/*
          python - <<'PY'
          from pathlib import Path
          import tarfile

          def is_conflict_copy(name):
              lowered = name.lower()
              return "gugroup" in lowered or "bing" in lowered and "mac" in lowered

          sdist = next(Path("dist").glob("*.tar.gz"))
          with tarfile.open(sdist) as archive:
              names = archive.getnames()
          assert not any(is_conflict_copy(name) for name in names)
          required_sources = {
              "pyqed/qchem/_integrals.cpp",
              "pyqed/qchem/_casscf_cpp.cpp",
              "pyqed/qchem/_gdf_cpp.cpp",
              "pyqed/qchem/_basis_cy.pyx",
              "pyqed/qchem/_rys_cy.pyx",
          }
          assert all(any(name.endswith(source) for name in names) for source in required_sources)
          PY
      - name: Store source distribution
        uses: actions/upload-artifact@v7
        with:
          name: python-package-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyqed
    permissions:
      id-token: write

    steps:
      - name: Retrieve verified distributions
        uses: actions/download-artifact@v8
        with:
          pattern: python-package-*
          path: dist/
          merge-multiple: true
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
